<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wingman</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-1 -3 14 14'><path fill='%23E07A55' fill-rule='evenodd' d='M2 0h8v2h2v2h-2v2H2V4H0V2h2ZM3 1v1h1V1ZM8 1v1h1V1ZM2 6h1v2H2ZM4 6h1v2H4ZM7 6h1v2H7ZM9 6h1v2H9Z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Orange on warm black, after Claude Code's palette. */
:root{
  --bg:#0D0C0B; --panel:#161412; --sunk:#1F1C19; --raise:#25211D; --ink:#F3EEE7; --ink-2:#B9AFA3; --ink-3:#80776C;
  --line:#2A2622; --line-2:#3B352F;
  --accent:#E07A55; --accent-soft:#2A1913; --accent-ink:#F2A584; --live:#E07A55; --on-accent:#120C09;
  --add-bg:#13201A; --add-ink:#8DCB9E; --del-bg:#2A1512; --del-ink:#F2917F;
  --warn-bg:#2A2011; --warn-ink:#E8B75E; --info-bg:#24201A; --info-ink:#E2CDA6;
  --shadow:0 18px 40px -22px rgba(0,0,0,.8);
  --glow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent),0 18px 50px -24px color-mix(in srgb,var(--accent) 45%,transparent);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 420px at 50% -180px,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%) no-repeat,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;overflow-x:clip}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible,.term:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:.08em .38em;border-radius:5px;color:var(--ink)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.top-in{max-width:1240px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.brand,.setwrap{flex:none}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--f-display);font-weight:600;font-size:23px;letter-spacing:-.01em}
.critter{display:block;fill:var(--accent);fill-rule:evenodd;shape-rendering:crispEdges;flex:none}
.brand .critter{width:30px;height:20px;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 45%,transparent))}
.live .brand .critter{animation:hop .9s steps(2,jump-none) infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* Project switcher */
.projwrap{position:relative;min-width:0;flex:0 1 auto}
.btn.proj{max-width:300px;min-width:0}
.btn.proj .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.btn.proj .pmore{font-size:11px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:0 7px;white-space:nowrap}
.btn.proj[aria-expanded="true"] .chv{transform:rotate(180deg)}
.sd{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.sd.live{background:var(--live);animation:ping 1.6s infinite}
.sd.wait{background:var(--warn-ink)}
.pop.projpop{left:0;right:auto;width:min(380px,calc(100vw - 32px));padding:10px;animation:none}
.pq{width:100%;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;margin-bottom:8px}
.plist{display:flex;flex-direction:column;gap:2px;max-height:min(60vh,420px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.tab{border:1px solid transparent;background:transparent;padding:7px 10px;border-radius:9px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;align-items:center;text-align:left;color:var(--ink-2);font:inherit;cursor:pointer;width:100%}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--ink)}
.tab b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on b{color:var(--accent-ink)}
.tab .when2{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.tab .pth{grid-column:2/4;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.plist .none{padding:12px;color:var(--ink-3);font-size:12.5px;text-align:center}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);min-width:0;max-width:340px;flex:0 1 auto}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.status.work .dot{background:var(--live);animation:ping 1.6s infinite}
.status.wait .dot{background:var(--warn-ink)}
.status.off .dot{background:var(--del-ink)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500}
.btn:hover:not(:disabled){background:var(--sunk)}
.btn.solid{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.solid:hover:not(:disabled){background:var(--accent-ink)}
.btn.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}

.wrap{max-width:1240px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:grid;grid-template-columns:272px minmax(0,1fr);gap:20px;align-items:start}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;overscroll-behavior:contain;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.rail::-webkit-scrollbar{width:6px}.rail::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.muted{color:var(--ink-3);font-size:12.5px;margin:0}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.plan li{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;color:var(--ink-3);font-size:13px}
.plan .mk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:10px;font-family:var(--f-mono)}
.plan li.done{color:var(--ink-2)}
.plan li.done .mk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.plan li.done .mk svg{width:11px;height:11px;stroke-width:3}
.plan li.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.plan li.active .mk{border-color:var(--accent)}
.work-run .plan li.active .mk{border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tree{display:flex;flex-direction:column;gap:1px;font-family:var(--f-mono);font-size:12.5px}
.tree .dir{color:var(--ink-3);padding:4px 6px;display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.tree .f{display:flex;align-items:center;gap:7px;padding:5px 6px 5px 22px;border-radius:7px;color:var(--ink-2)}
.tree .f .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .f .st{font-size:11px;display:flex;gap:4px;align-items:center}
.tree .a,.meta .a,.diff-h .a,.stat .a{color:var(--add-ink)}.tree .d,.meta .d,.diff-h .d,.stat .d{color:var(--del-ink)}
.stat b span{font-size:inherit;opacity:1}
.tree .f.active{background:var(--accent-soft);color:var(--accent-ink)}
.tag-new{font-size:10px;padding:0 5px;border-radius:4px;background:var(--info-bg);color:var(--info-ink);font-family:var(--f-body);font-weight:600}
.cost-n{font-family:var(--f-display);font-size:32px;font-weight:500;color:var(--accent-ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cost-n small{font-family:var(--f-body);font-size:13px;color:var(--ink-3);font-weight:400;margin-left:4px}


.runs{display:flex;flex-direction:column;gap:14px}
.run{display:flex;flex-direction:column;gap:12px}
.run-h{display:flex;gap:12px;align-items:flex-start;background:transparent;border:0;text-align:left;padding:4px 2px;width:100%;border-radius:12px}
.run-h .pr{flex:1;min-width:0;display:flex;flex-direction:column}
.run-h q{font-family:var(--f-display);font-size:25px;font-weight:500;letter-spacing:-.01em;quotes:none;color:var(--ink);text-wrap:balance;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.run-h .meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:6px;align-items:center;font-variant-numeric:tabular-nums}
.who{width:30px;height:30px;border-radius:9px;background:var(--sunk);color:var(--ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;margin-top:1px}
.chev{color:var(--ink-3);padding-top:6px}
.chev svg{transition:transform .2s}
.run.collapsed .chev svg{transform:rotate(-90deg)}
.run.collapsed .run-b{display:none}
.run.past .run-h{background:var(--panel);border:1px solid var(--line);padding:10px 14px;align-items:center}
.run.past .run-h:hover{border-color:var(--line-2);background:var(--sunk)}
.run.past .run-h .who{width:26px;height:26px;font-size:10px}
.run.past .run-h q{-webkit-line-clamp:1;color:var(--ink-2)}
.run.past .run-h .meta{margin-top:2px}
.run.past .chev{padding-top:0}
.run.past:not(.collapsed) .run-h q{-webkit-line-clamp:3;color:var(--ink)}
.run-h:focus:not(:focus-visible){outline:none}
.run.past.focus .run-h{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:var(--glow)}
.railfor{display:flex;flex-direction:column;gap:3px;padding:2px 4px 2px}
.railfor .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.railfor b{font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.3;color:var(--accent-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.railfor .back{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;color:var(--ink-2);margin-top:4px}
.railfor .back:hover{background:var(--sunk);color:var(--ink)}
.railfor .back svg{width:12px;height:12px}
/* A run's items hang under its prompt on a timeline. */
.run-b{margin-left:15px;padding:4px 0 6px 26px;border-left:1.5px solid var(--line-2);position:relative}
.run-b::after{content:"";position:absolute;left:-4.5px;bottom:-2px;width:7.5px;height:7.5px;border-radius:50%;background:var(--line-2)}
.by{display:flex;align-items:center;gap:9px;margin:0 0 12px -37px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.by .cb{width:20px;height:16px;display:grid;place-items:center;background:var(--bg)}
.by .critter{width:15px;height:10px}
.by b{font-weight:500;color:var(--accent-ink)}
.run-b .card::before{content:"";position:absolute;left:-32px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);box-sizing:border-box}
.run-b .card.now::before,.run-b .done-card::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.run-b .umsg::before{border-color:var(--accent)}
.run-b .cmd::before{top:17px;width:7px;height:7px;left:-32px;border-width:1.5px}
.run.past .run-b{margin-top:-2px}
.run.past q{font-size:18px}
.redir{display:inline-flex;align-items:center;gap:4px;color:var(--accent-ink)}
.redir svg{width:12px;height:12px}
.pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
.pill.work{background:color-mix(in srgb,var(--live) 14%,transparent);color:var(--live)}
.pill.wait{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ok{background:var(--accent-soft);color:var(--accent-ink)}
.sep{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:14px 0 0}
.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.feed{display:flex;flex-direction:column;gap:12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative}
.card.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.card.now{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:var(--glow)}
@keyframes enter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--ink-2)}
.k-logic .ico{background:var(--accent-soft);color:var(--accent)}
.k-delete .ico,.k-ask .ico{background:var(--warn-bg);color:var(--warn-ink)}
.k-new .ico,.k-config .ico{background:var(--info-bg);color:var(--info-ink)}
.k-test .ico{background:var(--add-bg);color:var(--add-ink)}
.path{font-family:var(--f-mono);font-size:13px;min-width:0;overflow-wrap:anywhere}
.path span{color:var(--ink-3)}
.title{font-weight:500;min-width:0}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.k-logic .chip{background:var(--accent-soft);color:var(--accent-ink)}
.k-delete .chip{background:var(--warn-bg);color:var(--warn-ink)}
.k-new .chip,.k-config .chip{background:var(--info-bg);color:var(--info-ink)}
.k-test .chip{background:var(--add-bg);color:var(--add-ink)}
.when{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.nowtag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:5px}
.step{font-size:12px;color:var(--ink-3);margin:8px 0 0 40px}
.ex{margin:10px 0 0 40px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.ex p{margin:0}
.ex .lead{font-family:var(--f-display);font-size:19px;color:var(--ink);font-weight:500;line-height:1.4}
.ex .why{color:var(--ink-2)}
.ex .why b{font-weight:600;color:var(--accent-ink)}
.ex .x{color:var(--ink-2);font-size:13px;padding:8px 10px;background:var(--sunk);border-radius:9px}
.ex .none{color:var(--ink-3);font-style:italic}
.lvchip{font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap}
.lvchip.off{border-style:dashed}
.lvnote{font-size:11.5px;color:var(--ink-3)}
.term{border-bottom:1.5px dotted var(--accent);cursor:help;position:relative;color:var(--ink)}
.term:hover::after,.term:focus::after{content:attr(data-def);position:absolute;left:0;top:calc(100% + 8px);width:min(260px,70vw);background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:400;line-height:1.45;padding:9px 11px;border-radius:9px;z-index:4;white-space:normal}
.diff{margin:12px 0 0 40px;border:1px solid var(--line);border-radius:11px;overflow:hidden;font-family:var(--f-mono);font-size:12.5px;line-height:1.7}
.diff-scroll{overflow-x:auto;max-height:420px;overflow-y:auto}
.diff table{border-collapse:collapse;width:100%;min-width:max-content}
.diff td{padding:0 12px 0 0;white-space:pre}
.diff td.ln{width:1%;padding:0 10px;color:var(--ink-3);text-align:right;user-select:none}
.diff td.sg{width:1%;padding:0 8px 0 0;user-select:none}
.diff tr.a{background:var(--add-bg);color:var(--add-ink)}
.diff tr.d{background:var(--del-bg);color:var(--del-ink)}
.diff tr.c{color:var(--ink-2)}
.diff tr.gap td{background:var(--sunk);color:var(--ink-3);text-align:center;font-size:11px}
.diff-h{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;background:var(--sunk);font-size:11.5px;color:var(--ink-3);border-bottom:1px solid var(--line)}
.diff-h span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending{margin:10px 0 0 40px;font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.showcode{margin:10px 0 0 40px;border:1px dashed var(--line-2);background:transparent;border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.showcode:hover{background:var(--sunk)}
.acts{display:flex;gap:6px;margin:14px 0 0 40px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:8px;font-size:12.5px;color:var(--ink-2)}
.act:hover:not(:disabled){border-color:var(--line-2);color:var(--ink);background:var(--sunk)}
.act.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.act svg{width:14px;height:14px}
.thread{margin:12px 0 0 40px;display:flex;flex-direction:column;gap:8px}
.thread:empty{display:none}
.msg{display:flex;gap:10px;font-size:13.5px;max-width:70ch}
.av{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none;margin-top:1px}
.msg.c .av{background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.msg.c .av .critter{width:15px;height:10px}
.msg.u .av{background:var(--sunk);color:var(--ink-2)}
.msg .bub{color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.msg .bub em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.msg .bub em.ok{color:var(--accent-ink)}
.reply{display:flex;gap:6px}
.reply input{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px}
.typing{display:inline-flex;gap:3px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

.ask{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn-ink) 30%,transparent)}
.ask .q{font-family:var(--f-display);font-size:21px;font-weight:500;margin:10px 0 0 40px;color:var(--ink)}

<body>
<header class="top" id="top">
  <div class="top-in">
    <div class="brand"><svg class="critter" viewBox="0 0 12 8" aria-hidden="true"><path d="M2 0h8v2h2v2h-2v2H2V4H0V2h2ZM3 1v1h1V1ZM8 1v1h1V1ZM2 6h1v2H2ZM4 6h1v2H4ZM7 6h1v2H7ZM9 6h1v2H9Z"/></svg>Wingman</div>
    <div class="projwrap" id="projwrap" hidden>
      <button class="btn proj" id="projBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="projPop" title="Switch project">
        <span class="sd" id="projDot"></span><span class="pname" id="projName"></span><span class="pmore" id="projMore" hidden></span>

      </button>

        <input class="pq" id="projQ" type="search" placeholder="Find a project" aria-label="Find a project" autocomplete="off">
        <div class="plist" id="tabs" role="listbox" aria-label="Projects"></div>
      </div>
    </div>
    <div class="spacer"></div>

    <div class="setwrap">
      <button class="btn" id="setBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="pop" title="Explanation settings">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
        <span class="lvname" id="lvName">Big picture</span>

</header>

<main class="wrap">

  <section>
    <div id="main"></div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="File changes"><div class="vbox" id="vbox"></div></div>

<script>
const IC={
  check:'<path d="M20 6 9 17l-5-5"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  play:'<path d="M7 4l13 8-13 8Z"/>',
  flask:'<path d="M9 3h6M10 3v6L4 20h16L14 9V3"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
  file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/>',
  send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/>',
  term:'<path d="M4 17l6-5-6-5M12 19h8"/>',
  down:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
  code:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  doc:'<path d="M6 3h9l3 3v15H6Z"/><path d="M9 12h6M9 16h6"/>',
  chev:'<path d="m6 9 6 6 6-6"/>'
};
const CRIT='<svg class="critter" viewBox="0 0 12 8" aria-hidden="true"><path d="M2 0h8v2h2v2h-2v2H2V4H0V2h2ZM3 1v1h1V1ZM8 1v1h1V1ZM2 6h1v2H2ZM4 6h1v2H4ZM7 6h1v2H7ZM9 6h1v2H9Z"/></svg>';
const ic=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';
const KIND={logic:["pencil","Logic change"],cosmetic:["pencil","Cosmetic"],new:["plus","New file"],delete:["trash","Deletion"],test:["flask","Test"],config:["gear","Config"],docs:["doc","Docs"],edit:["pencil","Edit"]};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
function fmt(s){
  s=esc(s);
  s=s.replace(/\{([^|{}]+)\|([^{}]+)\}/g,(m,t,d)=>'<span class="term" tabindex="0" data-def="'+d.replace(/`/g,"")+'">'+t+'</span>');
  return s.replace(/`([^`]+)`/g,"<code>$1</code>");
}
function splitPath(p){const i=p.lastIndexOf("/");return '<span>'+esc(p.slice(0,i+1))+'</span>'+esc(p.slice(i+1));}
function ago(ts){const s=Math.round((Date.now()-ts)/1000);return s<5?"just now":s<60?s+"s ago":s<3600?Math.round(s/60)+"m ago":s<86400?Math.round(s/3600)+"h ago":Math.round(s/86400)+"d ago";}
function dur(a,b){const t=Math.max(0,Math.round(((b||Date.now())-a)/1000));return t<60?t+"s":t<3600?Math.floor(t/60)+"m "+(t%60)+"s":Math.floor(t/3600)+"h "+Math.floor(t%3600/60)+"m";}
function clock(ts){const d=new Date(ts);const today=new Date().toDateString()===d.toDateString();return today?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString([],{month:"short",day:"numeric"});}

/* Update the DOM in place (keyed by data-cid / data-run) so buttons under the cursor survive live updates. */
const keyOf=n=>n.nodeType===1?(n.dataset.cid||n.dataset.run||null):null;
function morphEl(f,t){
  if(f.nodeName!==t.nodeName){f.replaceWith(t);return;}
  for(const a of [...f.attributes]) if(!t.hasAttribute(a.name)) f.removeAttribute(a.name);
  for(const a of [...t.attributes]) if(f.getAttribute(a.name)!==a.value) f.setAttribute(a.name,a.value);
  morphChildren(f,t);
}
function morphChildren(from,to){
  const tc=[...to.childNodes],keyed=new Map();
  for(const n of from.childNodes){const k=keyOf(n);if(k)keyed.set(k,n);}
  let i=0;
  for(const t of tc){
    const cur=from.childNodes[i]||null,k=keyOf(t);
    let m=null;
    if(k){m=keyed.get(k)||null;if(m)keyed.delete(k);}
    else if(cur&&!keyOf(cur)&&cur.nodeType===t.nodeType&&cur.nodeName===t.nodeName) m=cur;
    if(m){
      if(m!==cur) from.insertBefore(m,cur);
      if(m.nodeType===1) morphEl(m,t); else if(m.nodeValue!==t.nodeValue) m.nodeValue=t.nodeValue;
    } else from.insertBefore(t,cur);
    i++;
  }
  while(from.childNodes.length>i) from.lastChild.remove();
}
function setHTML(el,html){const tmp=document.createElement(el.tagName);tmp.innerHTML=html;morphChildren(el,tmp);}

/* view state that survives re-renders */
const V={state:null,sel:null,collapsed:{},showCode:{},replyOpen:{},drafts:{},seen:new Set(),first:true,connected:false};
try{V.sel=localStorage.getItem("wingman-project");}catch(e){}

async function post(body){
  try{const r=await fetch("/api/ui",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});return await r.json();}
  catch(e){return {error:e.message};}
}

function projects(){
  const ps=Object.values(V.state?V.state.projects:{});
  ps.sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  return ps;
}
function current(){
  const ps=projects();
  let p=ps.find(x=>x.key===V.sel);
  if(!p){p=ps[0];V.sel=p?p.key:null;}
  return p;
}
function runStatus(p,r){
  if(r.status!=="working") return ["ok","Done"];
  if(r.items.some(i=>i.type==="ask"&&i.answer===null)) return ["wait","Waiting for you"];
  return ["work","Working"];
}
function runTotals(r){
  let a=0,d=0,files=0;
  Object.values(r.files).forEach(f=>{a+=f.adds;d+=f.dels;if(f.adds||f.dels)files++;});
  const changes=r.items.filter(i=>i.type==="change").length;
  return {a,d,files,changes};
}

/* ---------- header ---------- */
function renderTop(){
  const ps=projects(),p=current();
  const dotOf=x=>{const r=x.runs[x.runs.length-1];if(!r||r.status!=="working")return "";return runStatus(x,r)[0]==="work"?"live":"wait";};
  // Dropdown list: every project, newest activity first, narrowed by the search box.
  const q=($("projQ").value||"").trim().toLowerCase();
  const shown=ps.filter(x=>!q||x.name.toLowerCase().includes(q)||String(x.cwd).toLowerCase().includes(q));
  setHTML($("tabs"),shown.length?shown.map(x=>{
    const r=x.runs[x.runs.length-1];
    return '<button class="tab'+(x.key===V.sel?' on':'')+'" type="button" role="option" aria-selected="'+(x.key===V.sel)+'" data-key="'+esc(x.key)+'" title="'+esc(x.cwd)+'">'+
      '<span class="sd '+dotOf(x)+'"></span><b>'+esc(x.name)+'</b><span class="when2">'+(r?ago(r.endedAt||r.startedAt):"")+'</span><span class="pth">'+esc(x.cwd)+'</span></button>';
  }).join(""):'<div class="none">No project matches “'+esc(q)+'”.</div>');
  $("projwrap").hidden=ps.length===0;
  $("projQ").hidden=ps.length<=5;
  $("projName").textContent=p?p.name:"";
  $("projDot").className="sd "+(p?dotOf(p):"");
  // Other projects where Claude is working right now.
  const others=ps.filter(x=>x!==p&&dotOf(x)).length;
  $("projMore").hidden=!others;$("projMore").textContent=others?others+" working":"";
  const s=$("status"),t=$("statusText");
  let cls="",txt="";
  if(!V.connected){cls="off";txt="Can't reach Wingman. Is it running?";}
  else if(!p){txt="Waiting for Claude";}
  else{
    const r=p.runs[p.runs.length-1];
    if(r&&r.status==="working"){
      const ask=r.items.some(i=>i.type==="ask"&&i.answer===null);
      cls=ask?"wait":"work";txt=ask?"Waiting for your answer":(p.activity||"Thinking…");
    } else {txt=r?"Idle · last run "+ago(r.endedAt||r.startedAt):"Idle";}
  }
  s.className="status "+cls;t.textContent=txt;
  document.body.classList.toggle("live",cls==="work");
  s.title=txt;
}

/* ---------- rail ---------- */
// The side panels describe the run you last opened, or the newest run.
function railRun(p){
  if(!p) return null;
  const latest=p.runs[p.runs.length-1];
  const f=V.focus&&p.runs.find(x=>x.id===V.focus);
  return f&&f!==latest?f:latest;
}
function renderRail(){
  const p=current();
  const r=railRun(p);
  if(!r){setHTML($("rail"),'<section class="box"><p class="eyebrow"><span>This run</span></p><p class="muted">The plan, files and explanation cost for the current prompt show up here.</p></section>');return;}
  let plan;
  if(r.steps.length){
    const done=r.stepState.filter(s=>s==="done").length;
    plan='<p class="eyebrow"><span>Plan</span><span>'+done+' of '+r.steps.length+'</span></p><ol class="plan">'+
      r.steps.map((s,i)=>{const st=r.stepState[i];return '<li class="'+st+'"><span class="mk">'+(st==="done"?ic("check"):st==="active"?"":i+1)+'</span>'+esc(s)+'</li>';}).join("")+'</ol>';
  } else plan='<p class="eyebrow"><span>Plan</span></p><p class="muted">Claude hasn\'t shared a plan for this prompt.</p>';
  const groups={};
  Object.keys(r.files).sort().forEach(f=>{const i=f.lastIndexOf("/");const d=i<0?".":f.slice(0,i);(groups[d]=groups[d]||[]).push(f);});
  let tree="";
  Object.keys(groups).forEach(d=>{
    // Folders outside the project are full paths; show just their last name (full path on hover).
    const outside=/^([a-z]:|\/)/i.test(d);
    tree+='<div class="dir" title="'+esc(d)+'">'+ic("folder")+esc(outside?"…/"+d.split("/").filter(Boolean).pop():d)+'</div>';
    groups[d].forEach(f=>{
      const s=r.files[f];
      const st=(s.adds||s.dels)?'<span class="st">'+(s.adds?'<span class="a">+'+s.adds+'</span>':"")+(s.dels?'<span class="d">−'+s.dels+'</span>':"")+'</span>':(s.read?'<span class="st">'+ic("eye")+'</span>':"");
      tree+='<button type="button" class="f'+(s.active&&r.status==="working"?" active":"")+'" title="Show '+esc(f)+'" data-file="'+esc(f)+'" data-run="'+r.id+'">'+(s.isNew?'<span class="tag-new">NEW</span>':ic("file"))+'<span class="n">'+esc(f.slice(f.lastIndexOf("/")+1))+'</span>'+st+'</button>';
    });
  });
  const changed=Object.values(r.files).filter(s=>s.adds||s.dels).length;
  $("rail").className="rail"+(r.status==="working"?" work-run":"");
  const isLatest=r===p.runs[p.runs.length-1];
  const showing='<div class="railfor"><span class="lbl">Showing</span><b>'+(isLatest?"Latest run":esc(r.prompt||r.goal||"Untitled run"))+'</b>'+
    (isLatest?"":'<button type="button" class="back" data-back="1">'+ic("x")+'Back to latest</button>')+'</div>';
  setHTML($("rail"),showing+'<section class="box">'+plan+'</section>'+
    '<section class="box"><p class="eyebrow"><span>Files</span><span>'+changed+' changed</span></p>'+(tree?'<div class="tree">'+tree+'</div>':'<p class="muted">No files touched yet.</p>')+'</section>'+
    '<section class="box"><p class="eyebrow"><span>Explanation cost</span></p><div class="cost-n">≈ '+r.tokens.toLocaleString()+'<small>tokens</small></div><p class="muted">Estimated tokens Claude spent explaining its work. Diffs come from hooks and cost nothing.</p></section>');
}

/* ---------- cards ---------- */
function diffHTML(c){
  const d=c.diff;
  let rows=d.rows.map(r=>r.t==="~"?'<tr class="gap"><td colspan="3">⋯</td></tr>':'<tr class="'+(r.t==="+"?"a":r.t==="-"?"d":"c")+'"><td class="ln">'+(r.n||"")+'</td><td class="sg">'+(r.t===" "?"":r.t)+'</td><td>'+esc(r.s)+'</td></tr>').join("");
  if(d.truncated) rows+='<tr class="gap"><td colspan="3">'+d.truncated+' more lines not shown</td></tr>';
  return '<div class="diff"><div class="diff-h"><span>'+esc(c.file)+'</span><span><span class="a">+'+d.adds+'</span> <span class="d">−'+d.dels+'</span></span></div><div class="diff-scroll"><table>'+rows+'</table></div></div>';
}
function cardHead(icon,kindCls,title,chip,at,isNow,extra){
  return '<div class="ch"><span class="ico">'+ic(icon)+'</span>'+title+(chip?'<span class="chip">'+chip+'</span>':"")+(extra||"")+'<span class="when">'+(isNow?'<span class="nowtag">Now</span>':"")+'<span>'+ago(at)+'</span></span></div>';
}
// Every explained card says which level it is written at.
function lvChip(c){
  if(!c.what||c.level==null||!V.state.levels) return "";
  const name=V.state.levels[c.level]||"";
  const off=c.level!==V.state.level;
  return '<span class="lvchip'+(off?' off':'')+'" title="'+(off?'Written at a different level than your current setting':'Written at your current level')+'">'+esc(name)+(c.simplified?' · simplified':'')+'</span>';
}
function changeCard(p,r,c,isNow){
  const lv=V.state.level;
  const k=KIND[c.kind]||KIND.edit;
  let h=cardHead(k[0],"",c.file?'<span class="path">'+splitPath(c.file)+'</span>':'<span class="title">Change</span>',k[1],c.at,isNow,lvChip(c));
  if(c.step&&r.steps[c.step-1]) h+='<p class="step">Step '+c.step+' · '+esc(r.steps[c.step-1])+'</p>';
  h+='<div class="ex">';
  if(c.what){
    h+='<p class="lead">'+fmt(c.what)+'</p>';
    if(c.why) h+='<p class="why"><b>Why:</b> '+fmt(c.why)+'</p>';
    if(c.extra) h+='<p class="x">'+fmt(c.extra)+'</p>';
  } else h+='<p class="none">Claude made this change without explaining it.</p>';
  h+='</div>';
  if(c.diff){
    if(lv===0&&!V.showCode[c.id]) h+='<button class="showcode" type="button" data-act="code" data-id="'+c.id+'">'+ic("code")+'Show the code ('+(c.diff.adds+c.diff.dels)+' lines changed)</button>';
    else h+=diffHTML(c);
  } else if(r.status==="working") h+='<p class="pending"><span class="typing"><i></i><i></i><i></i></span>Waiting for the edit</p>';
  else h+='<p class="pending">No edit was recorded for this explanation.</p>';
  h+='<div class="acts">'+
    '<button class="act" type="button" data-act="no" data-id="'+c.id+'">'+ic("x")+'Not like this</button>'+
    '</div>';
  let th=c.thread.map(m=>m.from==="claude"
    ?'<div class="msg c"><span class="av">'+CRIT+'</span><span class="bub">'+fmt(m.text)+'</span></div>'
    :'<div class="msg u"><span class="av">You</span><span class="bub">'+esc(m.text)+'<em class="'+(m.delivered?"ok":"")+'">'+(m.delivered?(m.kind==="no"?"Sent to Claude as a new prompt":"Delivered to Claude"):m.answering?"Claude is answering":r.status==="working"?"Waiting for Claude's next step":"Claude has finished. It gets this with your next message in Claude Code")+'</em></span></div>').join("");
  const last=c.thread[c.thread.length-1];
  if(last&&last.from==="user"&&((last.delivered&&r.status==="working")||last.answering)) th+='<div class="msg c"><span class="av">'+CRIT+'</span><span class="bub"><span class="typing"><i></i><i></i><i></i></span></span></div>';
  if(V.replyOpen[c.id]) th+='<form class="reply" data-id="'+c.id+'"><input id="in-'+c.id+'" placeholder="What should Claude do instead?" aria-label="Tell Claude what to change" value="'+esc(V.drafts[c.id]||"")+'"><button class="btn solid" type="submit">'+ic("send")+'Send</button></form>';
  h+='<div class="thread">'+th+'</div>';
  return '<article class="card k-'+esc(c.kind)+(isNow?" now":"")+'" data-cid="'+c.id+'">'+h+'</article>';
}
function askCard(c,isNow){
  const open=c.answer===null;
  let h='<div class="ch"><span class="ico">'+ic("help")+'</span><span class="title">Claude needs a decision</span><span class="when">'+(open?'<span class="nowtag">Waiting</span>':"")+'<span>'+ago(c.at)+'</span></span></div>';
  h+='<p class="q">'+esc(c.question)+'</p><div class="opts">'+c.options.map(o=>'<button class="opt'+(c.answer===o.label?" pick":"")+'" type="button" data-ask="'+c.id+'" data-choice="'+esc(o.label)+'"'+(open?"":" disabled")+'><b>'+esc(o.label)+'</b>'+(o.detail?'<span>'+esc(o.detail)+'</span>':"")+'</button>').join("")+'</div>';
  if(c.answer==="(no answer)") h+='<p class="pending">No answer in time. Claude used its own judgment.</p>';
  return '<article class="card ask k-ask'+(open?" now":"")+'" data-cid="'+c.id+'">'+h+'</article>';
}
function msgCard(c){
  return '<article class="card umsg" data-cid="'+c.id+'"><div class="ch"><span class="who">You</span><div style="flex:1;min-width:0"><p class="ub">'+esc(c.text)+'</p><p class="uc">'+esc(c.note||"Sent while Claude was working")+' · '+ago(c.at)+'</p></div></div></article>';
}
function cmdCard(c){
  const lv=V.state.level;
  const body=lv===0&&c.description?esc(c.description):(c.description&&lv<3?esc(c.description)+'<br>':"")+'<code>'+esc(c.command)+'</code>';
  return '<article class="card cmd" data-cid="'+c.id+'"><div class="ch"><span class="ico">'+ic("term")+'</span><span class="c">'+body+'</span><span class="when"><span>'+ago(c.at)+'</span></span></div></article>';
}
function doneCard(r){
  const t=runTotals(r);
  return '<article class="card done-card" data-cid="done-'+r.id+'"><div class="ch"><span class="ico">'+ic("check")+'</span><h3>Finished</h3><span class="when" style="color:inherit;opacity:.7">'+dur(r.startedAt,r.endedAt)+'</span></div>'+
   '<div class="stats"><div class="stat"><b>'+t.files+'</b><span>files changed</span></div><div class="stat"><b><span class="a">+'+t.a+'</span> <span class="d">−'+t.d+'</span></b><span>lines</span></div><div class="stat"><b>≈ '+r.tokens.toLocaleString()+'</b><span>explanation tokens</span></div></div></article>';
}

/* ---------- runs ---------- */
function runHTML(p,r,isLatest){
  const [cls,label]=runStatus(p,r);
  const t=runTotals(r);
  const collapsed=V.collapsed[r.id]!=null?V.collapsed[r.id]:!isLatest;
  const prompt=r.prompt||r.goal||"Untitled run";
  let meta='<span class="pill '+cls+'">'+label+'</span><span>'+t.changes+' change'+(t.changes===1?"":"s")+'</span>'+(t.a||t.d?'<span><span class="a">+'+t.a+'</span> <span class="d">−'+t.d+'</span></span>':"")+'<span>'+dur(r.startedAt,r.status==="working"?0:r.endedAt)+'</span><span>'+clock(r.startedAt)+'</span>'+(r.about!=null?'<span class="redir">'+ic("x")+'Not like this'+(r.about?' · '+esc(r.about):'')+'</span>':'');
  const focused=!isLatest&&!collapsed&&V.focus===r.id;
  let h='<section class="run'+(isLatest?"":" past")+(collapsed?" collapsed":"")+(focused?" focus":"")+'" data-run="'+r.id+'">'+
    '<button class="run-h" type="button" data-toggle="'+r.id+'" aria-expanded="'+!collapsed+'"><span class="who">You</span><span class="pr"><q>'+esc(prompt)+'</q><span class="meta">'+meta+'</span></span><span class="chev">'+ic("chev")+'</span></button>';
  h+='<div class="run-b"><p class="by"><span class="cb">'+CRIT+'</span><b>Claude</b>'+(r.status==="working"?"is working":"worked on this")+'</p><div class="feed">';
  const items=r.items.slice().reverse();
  if(r.status!=="working"&&t.changes) h+=doneCard(r);
  const nowId=r.status==="working"?(r.items.filter(i=>i.type==="change").slice(-1)[0]||{}).id:null;
  items.forEach(c=>{
    if(c.type==="change") h+=changeCard(p,r,c,c.id===nowId);
    else if(c.type==="ask") h+=askCard(c);
    else if(c.type==="message") h+=msgCard(c);
    else if(c.type==="cmd") h+=cmdCard(c);
  });
  if(!items.length) h+='<div class="empty">'+(r.status==="working"?"Claude is working on this. Changes appear here as it makes them.":"Nothing was changed in this run.")+'</div>';
  h+='</div></div></section>';
  return h;
}
function renderMain(){
  const p=current();
  if(!p){
    $("main").innerHTML='<div class="welcome"><h2>Waiting for Claude</h2><p>This page fills in live as soon as Claude starts working.</p>'+
      '<p>Start a new Claude Code session with the Wingman plugin turned on and give Claude a task.</p><p class="muted">Want to see it working first? Run <code>node bin/cli.js demo</code> from the Wingman folder.</p></div>';
    return;
  }
  // Older runs with no prompt and nothing to show (only reads or commands) are noise; leave them out.
  const runs=p.runs.slice().reverse().filter((r,i)=>i===0||r.prompt||r.goal||r.items.some(x=>x.type!=="cmd"));
  if(!runs.length){setHTML($("main"),'<div class="empty">No runs in '+esc(p.name)+' yet. Give Claude a prompt and it shows up here.</div>');return;}
  let h='<div class="runs">'+runHTML(p,runs[0],true);
  if(runs.length>1) h+='<p class="sep">Earlier in '+esc(p.name)+'</p>'+runs.slice(1).map(r=>runHTML(p,r,false)).join("");
  h+='</div>';
  setHTML($("main"),h);
}

function renderDial(){
  const l=V.state?V.state.level:0;
  document.querySelectorAll("#seg button").forEach(b=>{const on=+b.dataset.l===l;b.classList.toggle("on",on);b.setAttribute("aria-checked",on);});
  const n=(V.state&&V.state.levels||["Big picture","Technical"])[l];if(n)$("lvName").textContent=n;
}

function render(){
  const focus=document.activeElement&&document.activeElement.id&&document.activeElement.id.startsWith("in-")?document.activeElement:null;
  const fid=focus&&focus.id,sel=focus?[focus.selectionStart,focus.selectionEnd]:null;
  const sy=window.scrollY;
  renderTop();renderDial();renderRail();renderMain();
  document.querySelectorAll(".card[data-cid]").forEach(el=>{
    const id=el.dataset.cid;
    if(!V.seen.has(id)){V.seen.add(id);if(!V.first)el.classList.add("enter");}
  });
  V.first=false;
  if(fid){const el=$(fid);if(el){el.focus();try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
  window.scrollTo(0,sy);
}

function setMenu(open){$("pop").hidden=!open;$("setBtn").setAttribute("aria-expanded",open);}
$("setBtn").addEventListener("click",e=>{e.stopPropagation();if($("pop").hidden)setProj(false);setMenu($("pop").hidden);});
document.addEventListener("click",e=>{if(!$("pop").hidden&&!e.target.closest(".setwrap"))setMenu(false);});

/* ---------- file viewer ---------- */
const VW={blocks:[],at:-1,key:null,run:null};
// The folders from the project root down to the open file, with the file highlighted.
function treeHTML(t,file){
  if(!t)return "";
  const changed=new Set(t.changed);
  const last=t.levels.length-1;
  const row=(d,e,full,cls,inner)=>{
    const pad='style="padding-left:'+(12+d*14)+'px"';
    return changed.has(full)&&!/cur/.test(cls)
      ?'<button type="button" class="vt '+cls+'" '+pad+' data-vopen="'+esc(full)+'" title="Show '+esc(full)+'">'+inner+'</button>'
      :'<div class="vt '+cls+'" '+pad+(/cur/.test(cls)?' id="vtcur"':'')+'>'+inner+'</div>';
  };
  const level=(d,prefix)=>{
    const lv=t.levels[d];let h="";
    lv.entries.forEach(e=>{
      const full=prefix+e.name,open=e.name===lv.open;
      const cur=open&&d===last;
      const cls=(e.dir?"dir":"file")+(open?" onpath":"")+(cur?" cur":"");
      const inner=ic(e.dir?(open?"chev":"folder"):"file")+'<span class="nm">'+esc(e.name)+'</span>'+(changed.has(full)?'<i class="chg" title="Changed in this run"></i>':"");
      h+=row(d,e,full,cls,inner);
      if(open&&e.dir&&d<last)h+=level(d+1,full+"/");
    });
    if(lv.more)h+='<div class="vt more" style="padding-left:'+(12+d*14)+'px">… '+lv.more+' more</div>';
    return h;
  };
  return '<nav class="vtree" aria-label="Where this file is"><div class="vt-h">Location</div><div class="vt dir onpath">'+ic("folder")+'<span class="nm">'+esc(t.root)+'</span></div>'+level(0,"")+'</nav>';
}
function closeViewer(){$("viewer").hidden=true;$("vbox").innerHTML="";document.body.style.overflow="";}
async function openViewer(key,runId,file){
  VW.key=key;VW.run=runId;
  $("viewer").hidden=false;document.body.style.overflow="hidden";
  $("vbox").innerHTML='<div class="vh"><span class="path">'+splitPath(file)+'</span><span class="vnav"><button class="btn" type="button" data-vclose="1" aria-label="Close">'+ic("x")+'</button></span></div><div class="vload">Loading…</div>';
  let d;
  try{d=await (await fetch("/api/file?key="+encodeURIComponent(key)+"&run="+encodeURIComponent(runId)+"&file="+encodeURIComponent(file))).json();}
  catch(err){d={error:"Couldn't reach Wingman."};}
  if($("viewer").hidden)return;
  if(d.error){$("vbox").querySelector(".vload").textContent=d.error;return;}
  const rows=d.rows;
  // Group consecutive added/removed lines into change blocks for the nav and the side strip.
  const blocks=[];let cur=null;
  rows.forEach((r,i)=>{if(r.t==="+"||r.t==="-"){if(!cur){cur={start:i,end:i,a:0,d:0};blocks.push(cur);}cur.end=i;r.t==="+"?cur.a++:cur.d++;}else cur=null;});
  VW.blocks=blocks;VW.at=-1;
  const adds=rows.filter(r=>r.t==="+").length,dels=rows.filter(r=>r.t==="-").length;
  const body=rows.map((r,i)=>'<tr id="vr'+i+'" class="'+(r.t==="+"?"a":r.t==="-"?"d":"c")+'"><td class="ln">'+(r.t==="-"?"":r.n||"")+'</td><td class="sg">'+(r.t===" "?"":esc(r.t))+'</td><td>'+esc(r.s)+'</td></tr>').join("");
  const map=blocks.map((b,k)=>'<i class="'+(b.a?"a":"d")+'" data-vjump="'+k+'" style="top:'+(b.start/rows.length*100).toFixed(2)+'%;height:'+Math.max(.4,(b.end-b.start+1)/rows.length*100).toFixed(2)+'%"></i>').join("");
  const note=!d.exists?"This file was deleted in this run. Shown as it was.":!d.hasBase?"Highlights appear for files Claude changes from now on. This shows the file as it is now.":!blocks.length?"No differences from the start of this run.":d.approx?"Highlights rebuilt from the changes Claude recorded in this run. Later edits can shift them slightly.":"";
  $("vbox").innerHTML='<div class="vh"><span class="path">'+splitPath(file)+'</span>'+(d.hasBase&&blocks.length?'<span class="vstat"><span class="a">+'+adds+'</span> <span class="d">−'+dels+'</span> · '+blocks.length+' change'+(blocks.length===1?"":"s")+'</span>':"")+
    '<span class="vnav">'+(blocks.length?'<span class="vpos" id="vpos"></span><button class="btn" type="button" data-vstep="-1" aria-label="Previous change">'+ic("chev").replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" style="transform:rotate(180deg)"')+'</button><button class="btn" type="button" data-vstep="1" aria-label="Next change">'+ic("chev")+'</button>':"")+
    '<button class="btn" type="button" data-vclose="1" aria-label="Close">'+ic("x")+'</button></span></div>'+
    (note?'<div class="vnote">'+note+'</div>':"")+
    '<div class="vmain">'+treeHTML(d.tree,file)+'<div class="vbody" id="vbody"><table>'+body+'</table></div>'+(blocks.length?'<div class="vmap">'+map+'</div>':"")+'</div>';
  const here=$("vtcur"),tree=document.querySelector(".vtree");
  if(here&&tree)tree.scrollTop=Math.max(0,here.offsetTop-tree.clientHeight/2);
  if(blocks.length)vJump(0);
}
function vJump(k){
  if(!VW.blocks.length)return;
  k=(k+VW.blocks.length)%VW.blocks.length;VW.at=k;
  document.querySelectorAll("#vbody tr.hit").forEach(x=>x.classList.remove("hit"));
  const b=VW.blocks[k];
  for(let i=b.start;i<=b.end;i++){const tr=$("vr"+i);if(tr)tr.classList.add("hit");}
  const first=$("vr"+b.start),body=$("vbody");
  if(first&&body)body.scrollTop=Math.max(0,first.offsetTop-body.clientHeight/3);
  const pos=$("vpos");if(pos)pos.textContent="Change "+(k+1)+" of "+VW.blocks.length;
}
$("viewer").addEventListener("click",e=>{
  if(e.target===$("viewer")||e.target.closest("[data-vclose]")){closeViewer();return;}
  const st=e.target.closest("[data-vstep]");if(st){vJump(VW.at+Number(st.dataset.vstep));return;}
  const j=e.target.closest("[data-vjump]");if(j){vJump(Number(j.dataset.vjump));return;}
  const o=e.target.closest("[data-vopen]");if(o)openViewer(VW.key,VW.run,o.dataset.vopen);
});
document.addEventListener("keydown",e=>{
  if($("viewer").hidden)return;
  if(e.key==="Escape")closeViewer();
  else if(e.key==="n"||e.key==="j")vJump(VW.at+1);
  else if(e.key==="p"||e.key==="k")vJump(VW.at-1);
});
$("rail").addEventListener("click",e=>{
  const fb=e.target.closest("[data-file]");
  if(fb){const p=current();if(p)openViewer(p.key,fb.dataset.run,fb.dataset.file);return;}
  if(!e.target.closest("[data-back]"))return;
  if(V.focus)V.collapsed[V.focus]=true;
  V.focus=null;render();
});

  V.sel=key;V.pickedAt=Date.now();V.focus=null;try{localStorage.setItem("wingman-project",V.sel);}catch(err){}

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("projPop").hidden){setProj(false);$("projBtn").focus();}});

  const t=e.target.closest(".tab");if(t)pickProject(t.dataset.key);

$("main").addEventListener("click",e=>{
  const tg=e.target.closest("[data-toggle]");
  if(tg){
    const id=tg.dataset.toggle;const el=tg.closest(".run");const c=!el.classList.contains("collapsed");
    V.collapsed[id]=c;el.classList.toggle("collapsed",c);tg.setAttribute("aria-expanded",!c);
    // Opening a run points the side panels at it; closing it sends them back to the newest run.
    if(!c) V.focus=id; else if(V.focus===id) V.focus=null;
    render();return;
  }
  const o=e.target.closest("[data-ask]");
  if(o&&!o.disabled){const p=current();post({action:"answer",key:p.key,askId:o.dataset.ask,choice:o.dataset.choice});o.classList.add("pick");return;}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const p=current(),id=b.dataset.id,act=b.dataset.act;
  if(act==="code"){V.showCode[id]=true;render();return;}
  if(act==="no"){V.replyOpen[id]=true;render();const i=$("in-"+id);if(i)i.focus();return;}
  b.disabled=true;
  post({action:"feedback",key:p.key,cardId:id,kind:act});
});
$("main").addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("in-"))V.drafts[e.target.id.slice(3)]=e.target.value;});
$("main").addEventListener("submit",e=>{
  const f=e.target.closest(".reply");if(!f)return;
  e.preventDefault();
  const id=f.dataset.id,inp=f.querySelector("input"),v=inp.value.trim();
  if(!v){inp.placeholder="Type what you'd like changed first";inp.focus();return;}
  V.replyOpen[id]=false;V.drafts[id]="";
  post({action:"feedback",key:current().key,cardId:id,kind:"no",text:v});
});

/* Jump to a project where Claude just started working, unless you picked a tab in the last minute. */
function followActive(){
  if(Date.now()-(V.pickedAt||0)<60000) return;
  const isWorking=p=>{const r=p&&p.runs[p.runs.length-1];return r&&r.status==="working";};
  const cur=projects().find(x=>x.key===V.sel);
  if(isWorking(cur)) return;
  const live=projects().find(isWorking);
  if(live) V.sel=live.key;
}
function connect(){
  const es=new EventSource("/api/events");
  es.onmessage=ev=>{V.connected=true;V.state=JSON.parse(ev.data);followActive();render();};
  es.onerror=()=>{V.connected=false;renderTop();};
}
setInterval(()=>{if(V.state&&!document.querySelector(".reply input:focus"))render();},5000);
render();
connect();
</script>
